[pytest]
# Tests here run inside Flame only: `ayon run tests/run_flame_tests.py`.
testpaths = .
python_files = test_*.py
norecursedirs = hook
# Plugin logs repeat for every test and the warnings come from other
# addons, both are hidden: pass `-o addopts=-ra` to see them.
addopts = -ra --color=no --show-capture=no --disable-warnings
markers =
    publish: runs a full publish into the test project
